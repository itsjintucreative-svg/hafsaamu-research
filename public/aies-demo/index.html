<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIES — Hafsaamu (Demo)</title>
<style>
:root{--navy:#111329;--pur:#8955F6;--lp:#E9DDFF;--bg:#F7F7FB;--ok:#16A34A;--page:#e8e8f0;--tx:#111329;--mu:#6b6f85;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0b0c1a}}
:root[data-theme="dark"]{--page:#0b0c1a}
*{box-sizing:border-box;margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100%;background:var(--page)}
body{display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--tx);padding-top:env(safe-area-inset-top,0px)}
.scr{flex:1;overflow-y:auto;padding:16px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px #11132912;margin-bottom:12px}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(#2a2c45,#111329);color:#fff;font-weight:600;font-size:15px;cursor:pointer;margin-top:12px}
.btn.o{background:#fff;color:var(--tx);border:1px solid #dcdce8}
.ib{display:flex;align-items:center;gap:10px;border:1px solid #dcdce8;border-radius:12px;padding:0 14px;background:#fff;margin-top:12px}
.ib input{border:0;margin:0;padding:15px 0;flex:1;font-size:15px;outline:0;background:none;min-width:0}
input,select{width:100%;padding:13px;border:1px solid #dcdce8;border-radius:12px;font-size:15px;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{padding:8px 15px;border-radius:10px;background:#fff;border:1px solid #e8e8f2;white-space:nowrap;font-size:13px;cursor:pointer;flex:none}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.shop{display:flex;gap:12px;align-items:center;cursor:pointer;position:relative}
.th{width:68px;height:68px;border-radius:12px;display:grid;place-items:center;font-size:32px;flex:none}
.g{color:var(--ok);font-weight:700}.mu{color:var(--mu);font-size:12px}
.tag{display:inline-block;background:#f1f1f7;font-size:11px;padding:2px 7px;border-radius:6px;color:var(--mu);margin-top:3px}
.nav{display:flex;background:#fff;border-top:1px solid #eee;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:9px 0;font-size:11px;color:var(--mu);cursor:pointer}
.nav button.on{color:var(--pur);font-weight:700}.nav i{display:block;font-style:normal;font-size:21px}
.demo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 4px);right:8px;font-size:9px;background:var(--lp);color:var(--pur);padding:2px 7px;border-radius:8px;z-index:9;font-weight:700}
.tabs{display:flex;border-bottom:1px solid #eee;margin-bottom:14px}
.tabs b{flex:1;text-align:center;padding:12px 0;font-size:13px;color:var(--mu);cursor:pointer;font-weight:500}
.tabs b.on{color:var(--tx);border-bottom:2px solid var(--navy);font-weight:700}
.row{display:flex;justify-content:space-between;padding:9px 0;font-size:14px}
.pro{background:var(--lp);color:var(--pur);font-size:10px;padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:700}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:14px;font-size:18px;font-weight:700}
.hd button,.rb{border:0;background:none;font-size:22px;cursor:pointer;color:var(--tx)}
.tick{width:88px;height:88px;border-radius:50%;background:var(--ok);color:#fff;font-size:46px;display:grid;place-items:center;margin:40px auto 20px;animation:pop .5s;box-shadow:0 0 0 12px #16a34a1a}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.wm{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:800;color:#8955f61a;transform:rotate(-25deg);pointer-events:none}
.pill{display:inline-flex;gap:6px;color:var(--ok);font-size:13px;align-items:center}
.ci{width:40px;height:40px;border-radius:50%;background:#f1f1f7;display:grid;place-items:center;flex:none}
</style></head><body><div id="app"></div>
<script>
var LOGO='<svg width="34" height="30" viewBox="0 0 34 30"><path d="M17 0L34 30H22L17 20L12 30H0Z" fill="#8955F6"/><path d="M17 8L24 21H10Z" fill="#E9DDFF" opacity=".8"/></svg>';
var SH=[["Bibliophilia Cafe","Food & Beverage","Silchar",24.8,12.4,"☕","#7c4a2d"],["City Mart","Retail / Kirana","Silchar",18.6,18.2,"🛍️","#2563eb"],["Green Valley Store","Grocery","Guwahati",16.2,9.8,"🥬","#16a34a"],["Hotel Rajdhani Inn","Hospitality","Silchar",14.1,22.5,"🏨","#b45309"],["QuickFix Services","Services","Shillong",12.7,5.6,"🛠️","#475569"],["Barak Bakers","Food & Beverage","Guwahati",21.3,7.9,"🥐","#c2410c"],["Fashion Hub","Retail","Shillong",11.4,10.7,"👗","#be185d"],["Tea Garden Outlet","Other Businesses","Dibrugarh",15.5,6.3,"🍵","#0f766e"]].map(function(a,i){return{id:i,n:a[0],c:a[1],l:a[2],r:a[3],m:a[4],e:a[5],col:a[6],net:+(a[4]*.23).toFixed(1)}});
var CATS=["All","Food & Beverage","Retail","Grocery","Hospitality","Services","Other Businesses"],LOCS=["Silchar, Assam","Guwahati, Assam","Shillong, Meghalaya","Dibrugarh, Assam"];
var st={scr:"splash",tab:"Overview",hz:3,q:"",cat:"All",sort:"Performance",amt:1000,shop:0,loc:"Silchar, Assam",user:{name:"Jintu Ali",p1:true,doc:false,upi:false},fav:{},inv:[],cur:null},stack=[];
try{var sv=JSON.parse(localStorage.getItem("aies"));if(sv){st.inv=sv.inv||[];st.user=sv.user||st.user}}catch(e){}
function save(){try{localStorage.setItem("aies",JSON.stringify({inv:st.inv,user:st.user}))}catch(e){}}
function go(s,p){stack.push(st.scr);Object.assign(st,p||{});st.scr=s;draw()}
function back(){st.scr=stack.pop()||"home";draw()}
function root(s){stack=[];st.scr=s;draw()}
function set(o){Object.assign(st,o);draw()}
function fav(i,ev){ev.stopPropagation();st.fav[i]=!st.fav[i];draw(1)}
var inr=function(n){return"₹"+Math.round(n).toLocaleString("en-IN")};
function P(v,w,h){var mx=Math.max.apply(0,v)*1.1,mn=Math.min.apply(0,v)*.9;return v.map(function(y,i){return[i*w/(v.length-1),h-(y-mn)/(mx-mn)*h]})}
function D(a){return a.map(function(p,i){return(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)}).join(" ")}
function hist(s){var o=[];for(var i=0;i<6;i++){var rev=s.m*(.82+i*.04+(i%2)*.03);o.push({m:["Jun","Jul","Aug","Sep","Oct","Nov"][i],rev:+rev.toFixed(1),exp:+(rev*.77).toFixed(1)})}return o}
function bars(h){var mx=Math.max.apply(0,h.map(function(x){return x.rev}));return'<svg viewBox="0 0 320 130" width="100%">'+h.map(function(x,i){var a=x.rev/mx*100,b=x.exp/mx*100;return'<rect x="'+(i*53+6)+'" y="'+(110-a)+'" width="18" height="'+a+'" rx="4" fill="#8955F6"/><rect x="'+(i*53+26)+'" y="'+(110-b)+'" width="18" height="'+b+'" rx="4" fill="#E9DDFF"/><text x="'+(i*53+25)+'" y="126" font-size="10" text-anchor="middle" fill="#6b6f85">'+x.m+"</text>"}).join("")+"</svg>"}
function fc(s,hz){var base=hist(s).map(function(x){return x.rev-x.exp}),n=hz===12?6:hz+2,all=base.slice();for(var i=0;i<n;i++)all.push(all[all.length-1]*(1+s.r/1000+.01));var k=base.length,p=P(all,300,100);return'<svg viewBox="-4 -6 308 112" width="100%"><path d="'+D(p)+' L300,100 L0,100Z" fill="#8955F6" opacity=".1"/><path d="'+D(p.slice(0,k))+'" fill="none" stroke="#8955F6" stroke-width="2.5"/><path d="'+D(p.slice(k-1))+'" fill="none" stroke="#8955F6" stroke-width="2.5" stroke-dasharray="5 4"/></svg>'}
function spark(){return'<svg viewBox="0 0 100 40" width="110" style="position:absolute;right:12px;bottom:12px"><path d="M0,34 L18,28 L32,32 L50,20 L66,22 L84,8 L98,3" fill="none" stroke="#a78bfa" stroke-width="2.5"/></svg>'}
function chips(){return CATS.map(function(c){return'<span class="chip'+(st.cat===c?" on":"")+'" onclick="set({cat:\''+c+'\'})">'+c+"</span>"}).join("")}
function card(s){return'<div class="card shop" onclick="go(\'detail\',{shop:'+s.id+',tab:\'Overview\'})"><div class="th" style="background:'+s.col+'28">'+s.e+'</div><div style="flex:1"><b>'+s.n+'</b><br><span class="tag">'+s.c+'</span></div><div style="text-align:right"><span onclick="fav('+s.id+',event)" style="font-size:18px;color:'+(st.fav[s.id]?"#8955F6":"#9a9db0")+'">'+(st.fav[s.id]?"♥":"♡")+'</span><div class="g" style="font-size:17px;margin-top:6px">+'+s.r+'%</div><div class="mu">30D Return</div></div></div>'}
function head(t,r){return'<div class="hd"><button onclick="back()">←</button><span style="flex:1">'+t+"</span>"+(r||"")+"</div>"}
function nav(){var n=[["home","⌂","Home"],["explore","⌕","Explore"],["assets","▤","Assets"],["profile","☺","Profile"]];return'<div class="nav">'+n.map(function(x){return'<button class="'+(st.scr===x[0]?"on":"")+'" onclick="root(\''+x[0]+'\')"><i>'+x[1]+"</i>"+x[2]+"</button>"}).join("")+"</div>"}
function tot(){return st.inv.reduce(function(a,b){return a+b.amt},0)}
function ibox(ic,ph,t,sfx){return'<div class="ib"><span>'+ic+'</span><input placeholder="'+ph+'" type="'+(t||"text")+'">'+(sfx||"")+"</div>"}
function invoice(v){var s=SH[v.sid],e=v.amt*s.r/100;return'<div class="card" style="position:relative;overflow:hidden;padding:18px"><div class="wm">DEMO</div><div style="display:flex;align-items:center;gap:10px">'+LOGO+'<div><b style="font-size:20px">AIES</b><div class="mu">Hafsaamu</div></div><span style="margin-left:auto;background:#e3f6ea;color:var(--ok);padding:5px 10px;border-radius:10px;font-size:12px;font-weight:700">● Paid</span></div><div style="margin-top:10px;font-size:14px"><div class="row"><span class="mu">Invoice No.</span><b>'+v.id.replace("IN-","IN-")+'</b></div><div class="row"><span class="mu">Date</span><b>'+v.date+'</b></div><div class="row"><span class="mu">Investor</span><b>'+st.user.name+'</b></div><div class="row"><span class="mu">Investment In</span><b>'+s.n+'</b></div><div class="row"><span class="mu">Amount</span><b>'+inr(v.amt)+'</b></div><div class="row"><span class="mu">Estimated Return (30 Days)</span><b class="g">+'+inr(e)+'</b></div><div class="row"><span class="mu">Total Estimated Value</span><b>'+inr(v.amt+e)+'</b></div></div></div><div class="card mu" style="background:#f1f1f7;text-align:center;box-shadow:none">DEMO invoice. Fictional data; no real transaction occurred. Nothing here is a guaranteed return.</div>'}
function body(){var s=SH[st.shop],h,o="";
switch(st.scr){
case"splash":return'<div class="scr" style="background:radial-gradient(circle at 75% 25%,#5b3bb0 0,#1a1840 38%,#0c0d20 75%);color:#fff;display:flex;flex-direction:column;padding:28px 24px"><div style="text-align:center;margin-top:16vh;flex:1"><div style="transform:scale(1.6);display:inline-block">'+LOGO+'</div><h1 style="letter-spacing:7px;margin-top:20px">AIES</h1><div style="opacity:.8;font-size:14px;margin-top:4px">Hafsaamu</div></div><h1 style="font-size:34px;line-height:1.15;font-weight:700">Invest in<br>Real Businesses<br>Grow Together.</h1><div style="display:flex;gap:6px;margin:22px 0"><i style="width:7px;height:7px;border-radius:4px;background:#fff"></i><i style="width:7px;height:7px;border-radius:4px;background:#fff5"></i><i style="width:7px;height:7px;border-radius:4px;background:#fff5"></i></div><button class="btn" style="background:linear-gradient(90deg,#d8c8ff,#a98bff);color:#111329;margin:0" onclick="go(\'auth\')">Get Started →</button><p style="text-align:center;font-size:11px;opacity:.6;margin-top:16px">AIES – Economic Investment System · V1 research prototype</p></div>';
case"auth":return'<div class="scr" style="background:#fff"><div style="display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0 28px">'+LOGO+'<div><b style="font-size:24px">AIES</b><div class="mu">Hafsaamu</div></div></div><h2 style="text-align:center">Welcome Back</h2><div class="mu" style="text-align:center;font-size:14px;margin-top:4px">Sign in to your AIES account (mock)</div>'+ibox("👤","Email or Phone")+ibox("🔒","Password","password","<span>👁</span>")+'<p style="text-align:right;margin-top:14px;font-size:13px;cursor:pointer" onclick="alert(\'Demo only: no reset email is sent.\')">Forgot password?</p><button class="btn" onclick="root(\'home\')">Sign In</button><div class="mu" style="text-align:center;margin:14px 0">──────── or ────────</div><button class="btn o" style="margin-top:0" onclick="go(\'profile1\')">✉ &nbsp;Sign Up with Email</button><button class="btn o" onclick="root(\'home\')"><b style="color:#4285f4">G</b> &nbsp;Continue with Google</button><p style="text-align:center;margin-top:18px;font-size:13px">New to AIES? <b style="color:var(--pur);cursor:pointer" onclick="go(\'profile1\')">Create Account</b></p></div>';
case"profile1":var u=st.user,d=1+(u.doc?1:0)+(u.upi?1:0),R=[["👤","Personal Details","Name, DOB, Address",u.p1,"p1"],["📄","Verification & Documents","ID Proof (Aadhaar, PAN, etc.) — mock, nothing stored",u.doc,"doc"],["🏛","Bank / UPI Details","Bank account or UPI for invest & withdrawal — visual demo only",u.upi,"upi"]];return'<div class="scr">'+head("",'<span class="mu">Step '+d+" of 3</span>")+'<div style="height:5px;background:#e3e3ee;border-radius:5px;margin-top:-4px"><div style="height:5px;width:'+d*33.3+'%;background:var(--pur);border-radius:5px;transition:.3s"></div></div><h1 style="margin:26px 0 6px;font-size:26px">Complete Your Profile</h1><div class="mu" style="font-size:14px;margin-bottom:16px">Let’s set up your account for a secure investment experience.</div>'+R.map(function(r){return'<div class="card shop" onclick="st.user.'+r[4]+'=!st.user.'+r[4]+';draw()"><div class="ci">'+r[0]+'</div><div style="flex:1"><b style="font-size:15px">'+r[1]+'</b><div class="mu" style="margin-top:2px">'+r[2]+"</div></div>"+(r[3]?'<span style="background:var(--ok);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center">✓</span>':'<span class="mu" style="font-size:20px">›</span>')+"</div>"}).join("")+'<button class="btn" style="margin-top:40px" onclick="save();root(\'home\')">Continue</button></div>';
case"home":var top=SH.slice().sort(function(a,b){return b.r-a.r}).slice(0,3).map(card).join(""),Q=[["Invest","explore","✎"],["My Assets","assets","▣"],["History","history","↺"],["More","profile","⋯"]];return'<div class="scr" style="padding:0"><div style="background:linear-gradient(#111329,#1d1b4d);color:#fff;padding:18px 16px 46px"><div style="display:flex;align-items:center;gap:8px">'+LOGO+'<div><b>AIES</b><div style="font-size:9px;opacity:.7">Hafsaamu</div></div><span style="margin-left:auto;font-size:20px">🔔</span><span style="width:34px;height:34px;border-radius:50%;background:#8955F6;display:grid;place-items:center;font-weight:700">J</span></div><h2 style="margin-top:14px">Hi, '+st.user.name.split(" ")[0]+' 👋</h2><div style="opacity:.75;font-size:13px;margin:4px 0 12px">Explore trusted local businesses (fictional demo data) and invest in their growth.</div><select style="border-radius:22px;font-weight:500" onchange="set({loc:this.value})">'+LOCS.map(function(l){return"<option"+(l===st.loc?" selected":"")+">📍 "+l+"</option>"}).join("")+'</select><div style="position:relative;background:#ffffff12;border:1px solid #ffffff22;border-radius:16px;padding:14px;margin-top:14px"><div style="font-size:12px;opacity:.8">Total Portfolio (Demo)</div><div style="font-size:30px;font-weight:700;margin-top:4px">'+inr(tot()||5000)+' <span style="font-size:11px;background:#16a34a33;color:#4ade80;padding:2px 7px;border-radius:8px">▲ 4.2%</span></div>'+spark()+'</div></div><div style="padding:0 16px 16px"><div style="display:flex;gap:8px;margin:-26px 0 16px">'+Q.map(function(x){return"<div class='card' style='flex:1;text-align:center;font-size:11px;cursor:pointer;margin:0;padding:12px 4px' onclick=\"root('"+x[1]+"')\"><div style='font-size:18px;margin-bottom:4px'>"+x[2]+"</div>"+x[0]+"</div>"}).join("")+'</div><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b style="font-size:17px">Top Performing Shops</b><span class="mu" style="cursor:pointer;font-size:13px;color:var(--tx)" onclick="root(\'explore\')">See All</span></div>'+top+"</div></div>";
case"explore":var l=SH.filter(function(x){var q=st.q.toLowerCase();return(st.cat==="All"||x.c.indexOf(st.cat)===0)&&(x.n+x.l+x.c).toLowerCase().indexOf(q)>-1});l.sort(function(a,b){return st.sort==="Performance"?b.r-a.r:(st.sort==="Location"?a.l.localeCompare(b.l):a.c.localeCompare(b.c))});return'<div class="scr"><div class="hd"><button onclick="root(\'home\')">←</button><span style="flex:1"></span><span>🗺</span></div><h1 style="margin:-6px 0 12px;font-size:28px">Explore Shops</h1><div class="ib" style="margin-top:0"><span>⌕</span><input placeholder="Search shop, category or location" value="'+st.q+'" oninput="st.q=this.value;draw(1)"></div><div class="chips">'+chips()+'</div><select style="margin-bottom:12px" onchange="set({sort:this.value})">'+["Performance","Location","Category"].map(function(x){return"<option"+(x===st.sort?" selected":"")+">Sort: "+x+"</option>"}).join("")+"</select>"+(l.map(card).join("")||'<p class="mu">No shops match.</p>')+"</div>";
case"detail":var H=hist(s);if(st.tab==="Overview")o='<div class="card" style="display:flex;justify-content:space-around;text-align:center"><div><b class="g" style="font-size:20px">+'+s.r+'%</b><div class="mu">30D Return</div></div><div><b style="font-size:20px">₹'+s.m+'L</b><div class="mu">Monthly Sales</div></div><div><b style="font-size:20px">₹'+s.net+'L</b><div class="mu">Net Profit</div></div></div><b style="font-size:17px">About</b><p class="mu" style="margin:6px 0 14px;font-size:14px">A fictional '+s.c.toLowerCase()+" business in "+s.l+" with growing customer footfall, stable sales and high repeat rate. Not a real partner.</p><div style='display:flex;justify-content:space-between'><span class='pill'>✔ <span style='color:var(--tx)'>Verified (demo)</span></span><span class='pill'>✔ <span style='color:var(--tx)'>Active</span></span><span class='pill' style='color:var(--tx)'>⚠ Low Risk</span></div><div class='row' style='margin-top:8px'><span class='mu'>Operating expenses</span><b>₹"+(s.m*.77).toFixed(1)+"L</b></div>";
